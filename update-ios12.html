<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101720">
  <title>サンプラーの更新</title>
  <style>
    body{margin:0;padding:24px;background:#101720;color:#eef0f4;font:16px/1.8 sans-serif}
    main{max-width:640px;margin:auto}h1{font-size:24px}button,a{font:inherit}
    button,a{display:inline-block;padding:12px 18px;margin:8px 8px 8px 0;border:1px solid #a4def3;border-radius:6px;background:#263746;color:#fff}
    button:disabled{opacity:.5}p{overflow-wrap:break-word}[hidden]{display:none}
  </style>
</head>
<body><main>
  <h1>サンプラーの更新</h1>
  <p>PADが表示されずメニューも操作できないときに使います。保存した音源や設定を消さず、アプリのファイルを更新します。</p>
  <p>ほかのサンプラー画面で編集・取り込みをしている場合は、保存が終わってからその画面を閉じてください。</p>
  <button id="check">更新を確認</button>
  <button id="apply" hidden>更新を適用</button>
  <p id="status" role="status">インターネットにつながった状態で「更新を確認」を押してください。</p>
  <a id="open" href="./">サンプラーを開く</a>
  <p>Safariとホーム画面のアプリでは保存領域が異なることがあります。起動できなかった方でこのページを開いてください。サイトデータを削除すると音源が失われるため、削除は不要です。</p>
</main>
<script>
(function () {
  'use strict';
  var registration = null;
  var applying = false;
  var check = document.getElementById('check');
  var apply = document.getElementById('apply');
  var status = document.getElementById('status');
  function render() {
    apply.hidden = !(registration && registration.waiting);
    if (!apply.hidden)status.textContent = '更新の準備ができました。「更新を適用」を押してください。';
    else if (registration && registration.installing)status.textContent = '更新ファイルを準備しています…';
    else if (!applying)status.textContent = '確認が完了しました。「サンプラーを開く」で起動してください。';
  }
  function observe() {
    var worker = registration.installing;
    if (worker)worker.addEventListener('statechange', function () {
      if (worker.state === 'redundant')status.textContent = '更新ファイルを取得できませんでした。通信とアップロードしたファイルを確認してください。';
      else render();
    });
    render();
  }
  if (!('serviceWorker' in navigator) || !window.isSecureContext) {
    check.disabled = true;
    status.textContent = 'この画面ではオフライン用ファイルを更新できません。HTTPSの配信URLで開いてください。オンラインでの起動は「サンプラーを開く」を試してください。';
    return;
  }
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!applying)return;
    applying = false;
    apply.hidden = true;
    status.textContent = '更新を適用しました。「サンプラーを開く」で起動してください。';
  });
  check.onclick = function () {
    check.disabled = true;
    status.textContent = '更新を確認しています…';
    navigator.serviceWorker.register('./sw.js', { scope:'./', updateViaCache:'none' }).then(function (value) {
      registration = value;
      registration.addEventListener('updatefound', observe);
      observe();
      return registration.update();
    }).then(function () { render(); }, function () {
      status.textContent = '更新を確認できませんでした。通信とアップロードしたファイルを確認して、もう一度お試しください。';
    }).then(function () { check.disabled = false; });
  };
  apply.onclick = function () {
    if (!registration || !registration.waiting)return;
    applying = true;
    apply.hidden = true;
    status.textContent = '更新を適用しています…';
    registration.waiting.postMessage({ type:'SKIP_WAITING' });
  };
}());
</script>
</body></html>
