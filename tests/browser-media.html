<!doctype html><html lang="ja"><meta charset="utf-8"><title>音声・動画取込テスト</title>
<style>body{font:16px/1.7 sans-serif;max-width:900px;margin:30px auto;padding:20px}button{font:inherit;padding:12px}pre{white-space:pre-wrap}</style>
<h1>音声・動画取込テスト</h1><p>合成したMP4/MOVと初期音を使い、実際のブラウザで音声デコードと波形の振幅を確認します。実機スピーカーの聴感試験ではありません。</p>
<button id="run" disabled>テストを実行</button><pre id="result">準備中…</pre>
<script type="module">
import { extractVideoAudio } from '../js/video-audio.js';
import { readBlobBuffer } from '../js/file-compat.js';
import { decodeAudio,createChain } from '../js/audio-utils.js';
import { synth } from '../js/presets.js';
const button=document.getElementById('run'),result=document.getElementById('result');
const rms=data=>Math.sqrt(data.reduce((sum,value)=>sum+value*value,0)/data.length);
button.disabled=false;result.textContent='実行できます';
button.onclick=async()=>{
  button.disabled=true;result.textContent='実行中…';const checks=[];
  let context;
  try{
    const Offline=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    const offline=new Offline(1,44100,44100),chain=createChain(offline,offline.destination,.75),pad=synth(0);
    const buffer=offline.createBuffer(1,pad.audio.channels[0].length,pad.audio.rate);
    buffer.getChannelData(0).set(pad.audio.channels[0]);
    const source=offline.createBufferSource();source.buffer=buffer;source.connect(chain.input);source.start(0);
    const rendered=await new Promise((resolve,reject)=>{offline.oncomplete=event=>resolve(event.renderedBuffer);const value=offline.startRendering();if(value&&value.then)value.then(resolve,reject);});
    const level=rms(rendered.getChannelData(0));if(level<.005)throw Error('初期音の出力が無音です');
    checks.push({name:'初期音＋実際の音声出力経路',rms:level,pass:true});
    const Audio=window.AudioContext||window.webkitAudioContext;context=new Audio();
    for(const name of ['aac-video.mp4','aac-video.mov']){
      const file=await (await fetch('./fixtures/video/'+name)).blob();
      const extracted=await extractVideoAudio(file);
      const audio=await decodeAudio(context,await readBlobBuffer(extracted));
      const level=rms(audio.getChannelData(0));
      if(Math.abs(audio.duration-1.5)>.04||level<.01)throw Error(name+'の音声が不正です');
      checks.push({name:name+' → 音声抽出 → ネイティブデコード',duration:audio.duration,sampleRate:audio.sampleRate,rms:level,pass:true});
    }
    result.textContent=JSON.stringify({pass:true,checks},null,2);
  }catch(error){result.textContent=JSON.stringify({pass:false,error:error.message,checks},null,2);}
  finally{if(context&&context.close)context.close();button.disabled=false;}
};
</script></html>
